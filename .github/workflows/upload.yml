name: upload reels to Zernio storage (sealed)
# Started by a push that changes request.json. The presigned upload URLs arrive later,
# encrypted to a key that exists only inside this run; see .github/sealed_upload.py.
on:
  push:
    branches: [uploader]
    paths: [request.json]
permissions:
  contents: write
concurrency:
  group: uploader
  cancel-in-progress: false
jobs:
  upload:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Sealed upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/sealed_upload.py
